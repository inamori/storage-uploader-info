  <h1>利用について</h1>
  <p>Storage Uploaderは、所有者本人の端末で、本人が操作するGoogle Driveのファイルを保存・管理するためのツールです。一般向けのサービス登録、料金プラン、他の利用者のデータを保管する機能はありません。</p>
  <p>利用者は、取り扱う権限のあるファイルと保存先を指定します。ファイルの保存・整理・削除は、実行するコマンドや画面の指定に従います。Google Driveの利用にはGoogleが定める利用条件が適用されます。</p>
  <p>データの扱いは<a href="privacy.html">プライバシーポリシー</a>をご確認ください。</p>
